services:
  # VidSage FastAPI Backend
  - type: web
    name: vidsage-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: YTRAG_COLLECTION
        value: dsa_lectures_1024

  # VidSage React Frontend
  - type: web
    name: vidsage-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
